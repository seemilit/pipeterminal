name: Release PipeTerminal for Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pipeterminal-windows-release
  queue: max

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - name: Check publishing configuration
        shell: pwsh
        env:
          PAID_REPOSITORY: ${{ secrets.PAID_REPOSITORY }}
          PAID_REPO_TOKEN: ${{ secrets.PAID_REPO_TOKEN }}
        run: |
          foreach ($name in @('PAID_REPOSITORY', 'PAID_REPO_TOKEN')) {
              if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
                  throw "Configure $name in GitHub Actions before publishing."
              }
          }
          if ($env:PAID_REPOSITORY -eq $env:GITHUB_REPOSITORY) {
              throw "PAID_REPOSITORY must be the separate paid repository."
          }
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          path: pipeterminal
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: ${{ secrets.PAID_REPOSITORY }}
          ref: main
          token: ${{ secrets.PAID_REPO_TOKEN }}
          path: pipeterminal-private
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: x64
      - name: Build the EXE, portable ZIP and installer
        id: package
        shell: pwsh
        run: |
          python pipeterminal/packaging/build.py --name PipeTerminal-Paid --project-root pipeterminal-private --extension-package premium --release-formats
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $files = @(Get-ChildItem pipeterminal-private/dist -File | Where-Object Name -Match '^PipeTerminal-Paid-[0-9]+\.[0-9]+\.[0-9]+\.exe$')
          if ($files.Count -ne 1) { throw 'Expected exactly one versioned standalone EXE.' }
          $version = $files[0].BaseName.Substring('PipeTerminal-Paid-'.Length)
          foreach ($suffix in @('-Portable.zip', '-Setup.exe')) {
              if (-not (Test-Path -LiteralPath "pipeterminal-private/dist/PipeTerminal-Paid-$version$suffix" -PathType Leaf)) {
                  throw "Missing release package with suffix $suffix."
              }
          }
          "version=$version" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        with:
          name: pipeterminal-windows-packages
          path: |
            pipeterminal-private/dist/PipeTerminal-Paid-${{ steps.package.outputs.version }}.exe
            pipeterminal-private/dist/PipeTerminal-Paid-${{ steps.package.outputs.version }}-Portable.zip
            pipeterminal-private/dist/PipeTerminal-Paid-${{ steps.package.outputs.version }}-Setup.exe
          if-no-files-found: error
          compression-level: 0
          overwrite: true
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: pipeterminal-windows-packages
          path: release-files
      - name: Publish to GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="v$VERSION"
          ref="refs/tags/$tag"
          prefix="PipeTerminal-Paid-$VERSION"
          assets=("release-files/$prefix.exe" "release-files/$prefix-Portable.zip" "release-files/$prefix-Setup.exe")
          refs="$(git ls-remote origin "$ref" "$ref^{}")"
          if [[ -n "$refs" ]]; then
            commit="$(awk -v ref="$ref" '$2 == ref { tag = $1 } $2 == ref "^{}" { peeled = $1 } END { print (peeled ? peeled : tag) }' <<< "$refs")"
            if [[ "$commit" != "$GITHUB_SHA" ]]; then
              echo "::error::$tag already refers to a different commit."
              exit 1
            fi
          fi
          if release_assets="$(gh release view "$tag" --json assets --jq '.assets[].name')"; then
            for asset in "${assets[@]}"; do
              if ! grep -Fxq "${asset##*/}" <<< "$release_assets"; then
                gh release upload "$tag" "$asset"
              fi
            done
          else
            args=(--target "$GITHUB_SHA")
            if [[ -n "$refs" ]]; then args=(--verify-tag); fi
            gh release create "$tag" "${assets[@]}" "${args[@]}" --title "PipeTerminal $VERSION" --generate-notes
          fi

  publish-gitee:
    needs: [build, publish]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Download the published packages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          prefix="PipeTerminal-Paid-$VERSION"
          gh release download "v$VERSION" --dir release-files \
            --pattern "$prefix-Portable.zip" --pattern "$prefix-Setup.exe"
      - name: Publish to Gitee
        env:
          GITEE_REPOSITORY: ${{ vars.GITEE_REPOSITORY }}
          GITEE_RELEASE_TOKEN: ${{ secrets.GITEE_RELEASE_TOKEN }}
        shell: bash
        run: |
          if [[ -z "$GITEE_REPOSITORY" || -z "$GITEE_RELEASE_TOKEN" ]]; then
            echo '::error::Configure the GITEE_REPOSITORY variable and GITEE_RELEASE_TOKEN secret before publishing.'
            exit 1
          fi
          prefix="release-files/PipeTerminal-Paid-$VERSION"
          python packaging/publish_gitee.py "v$VERSION" "$GITHUB_SHA" \
            "$prefix-Portable.zip" "$prefix-Setup.exe"
